<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Askiical Letter Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Black+Han+Sans&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Do+Hyeon&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Major+Mono+Display&family=Nanum+Myeongjo:wght@400;800&family=Noto+Serif+KR:wght@400;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Space+Mono:wght@400;700&family=UnifrakturCook:wght@700&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>askiical</h1>
      <p>ASCII 유닛으로 한 글자를 짓는 타이포그래피 시뮬레이터</p>
    </div>
    <nav class="presets" id="presets" aria-label="프리셋"></nav>
    <div class="exports">
      <button type="button" id="ex-png">PNG</button>
      <button type="button" id="ex-svg">SVG</button>
      <button type="button" id="ex-txt">TXT</button>
      <button type="button" id="ex-copy" title="텍스트 아트를 클립보드로 복사">복사</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="ex-json" title="설정과 커스텀 글리프를 JSON으로 저장">저장</button>
      <label class="btn" for="im-json" title="저장한 JSON 프로젝트 불러오기">불러오기</label>
      <input type="file" id="im-json" accept=".json,application/json" hidden>
    </div>
  </header>

  <aside class="panel panel-left" id="controls" aria-label="설정"></aside>

  <main class="stage" id="stage">
    <canvas id="view" aria-label="ASCII 글자 미리보기"></canvas>
    <p class="stage-info" id="info"></p>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
  </main>

  <aside class="panel panel-right" aria-label="유닛">
    <section class="ctl-sec">
      <h3><span>유닛</span><em>UNITS</em></h3>
      <div class="ctl ctl-select">
        <label for="unit-font">유닛 서체</label>
        <select id="unit-font"></select>
      </div>
      <p class="note">칩을 누르면 켜고 끕니다. 끌어서 순서를 바꿀 수 있고, 순서는 <b>수동 램프</b>일 때 쓰입니다. 숫자는 셀 안에서 잉크가 차지하는 비율입니다.</p>
      <div class="unit-list" id="unit-list"></div>
      <form class="add-chars" id="add-chars">
        <input type="text" id="add-chars-input" placeholder="문자 입력 (예: .:-=+*#%@)" aria-label="추가할 문자">
        <button type="submit">추가</button>
      </form>
      <div class="charsets" id="charsets" aria-label="문자 세트로 교체"></div>
    </section>

    <section class="ctl-sec">
      <h3><span>톤 램프</span><em>RAMP</em></h3>
      <canvas id="ramp" class="ramp" aria-label="밝은 톤에서 어두운 톤까지 유닛 순서"></canvas>
      <p class="note" id="ramp-note"></p>
    </section>

    <section class="ctl-sec">
      <h3><span>커스텀 글리프</span><em>VECTOR</em></h3>
      <p class="note">직접 그리거나 SVG를 가져온 벡터 글리프를 유닛으로 섞을 수 있습니다. 밀도가 비슷한 문자와 자동으로 섞입니다.</p>
      <div class="glyph-lib" id="glyph-lib"></div>
      <div class="row-btns">
        <button type="button" id="new-glyph" class="primary">새 글리프 그리기</button>
        <label class="btn" for="svg-import">SVG 가져오기</label>
        <input type="file" id="svg-import" accept=".svg,image/svg+xml" hidden>
      </div>
    </section>
  </aside>
</div>

<dialog id="editor" aria-labelledby="ed-title">
  <div class="ed">
    <header class="ed-head">
      <h2 id="ed-title">글리프 편집</h2>
      <label class="ed-name"><span>이름</span><input type="text" id="ed-name" maxlength="24"></label>
      <label class="ed-name"><span>TXT 대체 문자</span><input type="text" id="ed-fallback" maxlength="1" size="2"></label>
    </header>

    <div class="ed-body">
      <div class="ed-tools" role="toolbar" aria-label="그리기 도구">
        <div class="seg" id="ed-toolset">
          <button type="button" data-tool="pixel" title="격자 칸을 칠하거나 지웁니다 (P)">픽셀</button>
          <button type="button" data-tool="pen" title="클릭으로 점을 찍고, 첫 점을 누르거나 Enter로 닫습니다. 더블클릭은 열린 선 (N)">펜</button>
          <button type="button" data-tool="rect" title="드래그, Shift는 정사각형 (R)">사각형</button>
          <button type="button" data-tool="ellipse" title="드래그, Shift는 정원 (E)">원</button>
          <button type="button" data-tool="line" title="드래그해서 직선 (L)">직선</button>
        </div>
        <div class="seg" id="ed-modeset">
          <button type="button" data-mode="fill">채움</button>
          <button type="button" data-mode="stroke">선</button>
        </div>
        <label class="mini">선 두께 <output id="ed-sw-o"></output><input type="range" id="ed-sw" min="1" max="30" step="1"></label>
        <label class="mini">격자
          <select id="ed-grid">
            <option value="4">4</option><option value="8">8</option><option value="12">12</option>
            <option value="16">16</option><option value="24">24</option><option value="32">32</option>
          </select>
        </label>
        <label class="mini chk"><input type="checkbox" id="ed-snap"> <span>격자에 맞춤</span></label>
        <label class="mini">채움 규칙
          <select id="ed-rule"><option value="nonzero">nonzero</option><option value="evenodd">evenodd (구멍)</option></select>
        </label>
        <div class="row-btns">
          <button type="button" id="ed-undo" title="Ctrl+Z">실행 취소</button>
          <button type="button" id="ed-redo" title="Ctrl+Shift+Z">다시 실행</button>
          <button type="button" id="ed-clear">모두 지우기</button>
        </div>
      </div>

      <div class="ed-canvas-wrap">
        <canvas id="ed-canvas" aria-label="글리프 캔버스 100×100"></canvas>
        <p class="note" id="ed-hint"></p>
      </div>

      <div class="ed-side">
        <h4>도형</h4>
        <ol class="ed-shapes" id="ed-shapes"></ol>
        <h4>SVG path d</h4>
        <textarea id="ed-d" rows="4" spellcheck="false" placeholder="M10 10 L90 10 L50 90 Z (좌표계 0–100)"></textarea>
        <div class="row-btns">
          <button type="button" id="ed-add-d">새 경로로 추가</button>
          <button type="button" id="ed-set-d">선택 경로 갱신</button>
        </div>
        <div class="row-btns">
          <label class="btn" for="ed-svg">SVG 파일 합치기</label>
          <input type="file" id="ed-svg" accept=".svg,image/svg+xml" hidden>
        </div>
        <h4>미리보기 <span class="dens" id="ed-dens"></span></h4>
        <canvas id="ed-preview" class="ed-preview"></canvas>
      </div>
    </div>

    <footer class="ed-foot">
      <button type="button" id="ed-delete" class="danger">글리프 삭제</button>
      <span class="grow"></span>
      <button type="button" id="ed-cancel">취소</button>
      <button type="button" id="ed-save" class="primary">저장</button>
    </footer>
  </div>
</dialog>

<script src="core.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>
</body>
</html>
